name: Collect PM2.5 data

on:
  schedule:
    - cron: "10 * * * *"   # ทุกชั่วโมง (เวลา UTC) นาทีที่ 5
  workflow_dispatch:       # กดรันเองจากหน้า Actions ได้

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collect_air_quality.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
